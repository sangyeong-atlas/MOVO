<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOVO 모바일 B안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@500;600;700;800&display=swap">
<style>
/* 레이아웃: 지도 전면 + 바텀 시트, 큰 제목과 시간 숫자, 레일 타임라인. 카드는 꼭 필요한 곳에만 */
:root{
  --navy:#002c5f; --sand:#e4dcd3; --paper:#f6f3f2; --brown:#a36b4f;
  --ink:#0a1a30; --mut:#6d6a67; --faint:#a8a29c; --line:#ebe6e1; --white:#ffffff;
  --navy-t:#e6ecf4; --brown-t:#f4e9e1; --live:#2f6fe0;
  --kr:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --en:'Outfit','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fill);color:var(--ink);font-family:var(--kr);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
svg{display:block}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1640px;margin:0 auto;padding:44px max(20px,env(safe-area-inset-right,0px)) 80px max(20px,env(safe-area-inset-left,0px))}
.top{display:flex;flex-wrap:wrap;gap:20px 48px;align-items:flex-end;justify-content:space-between;margin-bottom:44px;border-bottom:2px solid var(--navy);padding-bottom:28px}
.logo{font-family:var(--en);font-weight:700;letter-spacing:.04em;color:var(--navy);line-height:1}
.top .logo{font-size:52px}
.top h1{font-size:19px;font-weight:700;margin-top:12px}
.top p{color:var(--mut);max-width:62ch;margin-top:6px}
.sw{display:flex}
.sw span{width:78px;height:54px;font:600 10.5px var(--en);display:flex;align-items:flex-end;padding:7px 8px}
.sec{margin-top:52px}
.sec>h2{font-size:24px;font-weight:700;color:var(--navy);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec>h2 small{font-size:13px;font-weight:600;color:var(--brown)}
.row{display:flex;flex-wrap:wrap;gap:44px 40px;margin-top:26px}
.shot{width:360px;max-width:100%}
.shot figcaption{margin-bottom:16px;min-height:62px}
.shot figcaption b{font-size:15px;font-weight:700}
.shot figcaption em{font-style:normal;font-size:11px;font-weight:700;color:var(--navy);border:1.5px solid var(--navy);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.shot figcaption em.p{color:var(--brown);border-color:var(--brown)}
.shot figcaption p{font-size:12.5px;color:var(--mut);margin-top:4px}

.phone{width:360px;height:760px;border-radius:46px;background:var(--white);position:relative;overflow:hidden;box-shadow:0 0 0 9px #0b1526,0 0 0 10px #27344a,0 30px 60px -20px rgba(0,44,95,.4);margin:9px;display:flex;flex-direction:column}
.sb{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0;font:700 14px var(--en);position:relative;z-index:6}
.sb::after{content:"";position:absolute;left:50%;top:10px;width:92px;height:26px;margin-left:-46px;border-radius:99px;background:#0b1526}
.sb svg{width:58px;height:12px;fill:currentColor}
.scr{flex:1;min-height:0;padding:4px 22px 0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.fl{display:flex;align-items:center;gap:10px}
.sbw{justify-content:space-between}
.grow{flex:1;min-width:0}
h3.h{font-size:32px;font-weight:700;line-height:1.16;letter-spacing:-.03em}
h3.h span{font-weight:400;color:var(--faint)}
.eyb{font-size:12px;font-weight:700;color:var(--brown);letter-spacing:.02em}
.sub{font-size:12.5px;color:var(--mut)}
.b{font-weight:700}.x{font-weight:700}
.num{font-family:var(--en);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cb{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 10px rgba(10,26,48,.16);color:var(--ink);flex:none}
.cb.fl0{box-shadow:none;background:var(--fill)}
.av{width:38px;height:38px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #fff}
.avs{display:flex}.avs .av+.av{margin-left:-10px}
.a1{--a:#cfe0dc;--h:#3c2f2a;--c:#2f5d57}.a2{--a:#f6dcc8;--h:#5a3a2a;--c:#a36b4f}.a3{--a:#dcd3ee;--h:#2e2430;--c:#002c5f}.a4{--a:#e4dcd3;--h:#8b8580;--c:#6b7a8f}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:7px;font-size:11.5px;font-weight:700;background:var(--fill);color:#4b4743;white-space:nowrap}
.tag .ic{width:12px;height:12px;stroke-width:2.4}
.tag.n{background:var(--navy-t);color:var(--navy)}.tag.br{background:var(--brown-t);color:var(--brown)}.tag.s{background:var(--sand);color:var(--ink)}
.pillb{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:99px;background:var(--fill);font-weight:700;font-size:13.5px;white-space:nowrap}
.pillb.on{background:var(--navy);color:#fff}
.pillb .ic{width:16px;height:16px}
.cta{height:56px;border-radius:16px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;flex:none}
.cta.o{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.cta.s{background:var(--sand);color:var(--navy)}
.foot{margin-top:auto;padding:12px 0 24px;display:flex;flex-direction:column;gap:10px}
.hr{height:1px;background:var(--line);flex:none}
.tg{width:46px;height:28px;border-radius:99px;background:var(--navy);position:relative;flex:none}
.tg::after{content:"";position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff}
/* tab bar */
.tab{height:80px;flex:none;border-top:1px solid var(--line);background:#fff;display:flex;justify-content:space-around;align-items:flex-start;padding:10px 12px 0;position:relative;z-index:4}
.tab a{width:60px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--faint)}
.tab a .ic{width:23px;height:23px}
.tab a.on{color:var(--navy);font-weight:700}
.tab .fab{width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;margin-top:-28px;box-shadow:0 8px 18px rgba(0,44,95,.35),0 0 0 5px #fff}
/* map + sheet */
.mapf{position:absolute;inset:0}
.mapf svg.m,.mapb svg.m{width:100%;height:100%}
.mapb{border-radius:20px;overflow:hidden;position:relative;flex:none;background:#efece8}
.float{position:absolute;z-index:3}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:10px 22px 22px;box-shadow:0 -8px 30px rgba(10,26,48,.12);display:flex;flex-direction:column;gap:14px;z-index:4}
.sheet::before{content:"";width:40px;height:5px;border-radius:3px;background:#d9d3cd;align-self:center}
.mt{font:600 10px var(--kr);fill:#9aa1a8}
.ml{font:700 11px var(--kr);fill:var(--ink)}
/* progress nodes (pickup) */
.prog{display:flex;align-items:center}
.prog .nd{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.prog .nd .ic{width:16px;height:16px}
.prog .nd.w{background:var(--fill);color:var(--ink)}
.prog .nd.me{background:var(--brown);box-shadow:0 0 0 4px var(--brown-t)}
.prog .ln{flex:1;height:4px;background:var(--navy)}
.prog .ln.h{background:linear-gradient(to right,var(--navy) 55%,var(--line) 55%)}
.prog .ln.w{background:var(--line)}
/* rail timeline */
.rail{display:grid;grid-template-columns:44px 20px 1fr;column-gap:10px}
.rail .t{font:700 14px var(--en);font-variant-numeric:tabular-nums;text-align:right;padding-top:1px}
.rail .t small{display:block;font:500 10.5px var(--kr);color:var(--faint)}
.rail .r{position:relative;display:flex;justify-content:center}
.rail .r::before{content:"";position:absolute;top:0;bottom:0;width:3px;background:var(--navy-t);border-radius:2px}
.rail .r.first::before{top:8px}.rail .r.last::before{bottom:auto;height:8px}
.rail .r i{position:relative;width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--navy);margin-top:2px}
.rail .r i.f{background:var(--brown);border-color:var(--brown)}
.rail .r i.s{width:10px;height:10px;border-width:3px;border-color:var(--brown);margin-top:5px}
.rail .c{padding-bottom:16px}
.rail .c b{font-size:15px;font-weight:700}
.rail .gap{font-size:11.5px;color:var(--mut);padding-bottom:14px}
/* list row */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 0}
.lrow+.lrow{border-top:1px solid var(--line)}
.sq{width:52px;height:52px;border-radius:14px;background:var(--fill);display:grid;place-items:center;color:var(--navy);flex:none}
.sq.n{background:var(--navy);color:#fff}.sq.br{background:var(--brown-t);color:var(--brown)}.sq.s{background:var(--sand)}
.circ{width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(10,26,48,.1);display:grid;place-items:center;color:var(--ink)}
.circ.on{background:var(--navy);color:#fff}
.opt{flex:1;border-radius:18px;padding:14px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700}
.opt.on{background:var(--navy);color:#fff;box-shadow:none}
.opt small{display:block;font-weight:500;font-size:11.5px;opacity:.7;margin-top:2px}
.wave{display:flex;align-items:center;gap:3px;height:28px;flex:1}
.wave i{width:3px;border-radius:2px;background:var(--navy)}
.wave i.o{background:var(--sand)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px;color:var(--faint);flex:none}
.tabs span{padding-bottom:10px}
.tabs .on{color:var(--ink);box-shadow:inset 0 -3px 0 var(--navy)}

/* ---- 둥근 버전: A안의 서체·크기·여백·둥근 카드 ---- */
.phone{background:var(--paper);--fill:#fff}
.sheet{--fill:var(--paper);border-radius:34px 34px 0 0;padding:10px 18px 22px;gap:12px}
.logo{letter-spacing:-.02em}
.scr{padding:6px 18px 0;gap:12px}
h3.h{font-size:25px;font-weight:900;line-height:1.28;letter-spacing:-.02em}
h3.h span{font-weight:500}
.x{font-weight:700}
.eyb{font-size:12px}
.shot figcaption b,.top h1{font-weight:700}
.sec>h2{font-weight:900;font-size:22px}
.cta{height:54px;border-radius:18px;font-weight:700}
.tag{border-radius:99px;padding:0 10px;background:#efeae5}
.pillb{background:var(--fill);padding:0 14px;box-shadow:0 2px 8px rgba(0,44,95,.05)}
.sheet .pillb{box-shadow:none}
.pillb.on{background:var(--navy)}
.sq{background:#efeae5;border-radius:16px}
.cb.fl0{background:#fff;box-shadow:0 2px 8px rgba(0,44,95,.07)}
.opt{background:#fff;border-radius:20px;box-shadow:0 3px 14px rgba(0,44,95,.06)}
.opt.on{background:var(--navy)}
.lrow{background:#fff;border-radius:22px;padding:12px 14px;box-shadow:0 3px 14px rgba(0,44,95,.05)}
.lrow+.lrow{border-top:0;margin-top:8px}
.scr>.rail{background:#fff;border-radius:24px;padding:16px 14px 16px 8px;box-shadow:0 3px 14px rgba(0,44,95,.06)}
.mapb{border-radius:24px}
.tab a{font-weight:500}.tab a.on{font-weight:700}
.tabs{font-weight:700}
.mt{font-weight:700}

/* ---- A안 컴포넌트 미감으로 통일 ---- */
:root{--navy-m:#9db0c9;--card:#fff}
.top{border-bottom:0;padding-bottom:0}
.sw{gap:8px}.sw span{width:74px;border-radius:14px;border:1px solid rgba(0,0,0,.06)}
body{background:#ece6df}
.logo{display:inline-flex;align-items:flex-start}
.logo svg{width:.55em;height:.55em;stroke:var(--brown);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;margin-left:.04em}
.shot figcaption em{border:0;background:var(--navy-t);padding:2px 9px;font-size:11.5px}
.shot figcaption em.p{background:var(--brown-t)}
.hd{display:flex;align-items:center;justify-content:space-between;height:40px;flex:none}
.hd .logo{font-size:27px}
.rb{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--navy);box-shadow:0 2px 8px rgba(0,44,95,.07)}
h3.big{font-size:23px;font-weight:900;line-height:1.28;letter-spacing:-.02em}
.lab{font-size:11.5px;color:var(--mut);font-weight:500}
.fl.sb2{justify-content:space-between}
.av{width:36px;height:36px}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:#efeae5;color:#4d4741;white-space:nowrap}
.chip .ic{width:12px;height:12px;stroke-width:2.4}
.chip.n{background:var(--navy-t);color:var(--navy)}
.btn{height:54px;border-radius:18px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;flex:none}
.btn.md{height:44px;border-radius:15px;font-size:14px}
.dash{border:1.5px dashed #cdc3b8;border-radius:18px;height:48px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--navy);font-weight:700;font-size:13.5px;flex:none}
.room{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:13px 14px}
.room .ti{font-size:15.5px;font-weight:700}
.room .avs{min-width:36px;flex:none}.room .sub{white-space:nowrap}
.room.sel{background:var(--navy-t);box-shadow:inset 0 0 0 2px var(--navy);flex-direction:column;align-items:stretch;border-radius:24px;padding:15px}
.tab{height:78px;padding:8px 10px 0;align-items:normal}
.tab a{width:68px;height:50px;border-radius:17px;justify-content:center;gap:2px;font-size:10.5px;font-weight:500}
.tab a .ic{width:20px;height:20px}
.tab a.on{background:var(--navy-t);color:var(--navy);font-weight:700}
.cb{box-shadow:0 2px 8px rgba(0,44,95,.1);color:var(--navy)}
.sq{color:var(--navy)}
.cta.o{box-shadow:inset 0 0 0 2px var(--sand)}
</style>
</head>
